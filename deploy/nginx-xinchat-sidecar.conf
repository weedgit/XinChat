# XinChat sidecar ΓÇö runs beside Qchat without taking :80/:443/:8080.
# Enable with:
#   ln -sfn /root/xinchat/deploy/nginx-xinchat-sidecar.conf /etc/nginx/sites-enabled/xinchat-sidecar.conf
#   ufw allow 8443/tcp comment 'XinChat HTTPS sidecar'
#   nginx -t && systemctl reload nginx
#
# Do NOT enable deploy/nginx-xinchat.conf while Qchat owns default :443.
#
# Access: https://<host>:8443/  and  https://<host>:8443/admin/

# Unique zone names (safe alongside qchat_* zones).
limit_req_zone $binary_remote_addr zone=xinchat_side_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=xinchat_side_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=xinchat_side_ws:10m rate=10r/m;

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /root/xinchat/deploy/certs/xinchat.crt;
    ssl_certificate_key /root/xinchat/deploy/certs/xinchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /root/xinchat/apps/web/out;
    index index.html;
    client_max_body_size 210m;

    location ~ ^/v1/auth/(login|register|captcha) {
        limit_req zone=xinchat_side_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ws {
        limit_req zone=xinchat_side_ws burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        limit_req zone=xinchat_side_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location = /metrics {
        return 404;
    }

    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /root/xinchat/apps/admin/out/;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
